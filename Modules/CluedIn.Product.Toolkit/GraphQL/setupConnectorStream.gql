mutation setupConnectorStream(
  $streamId: ID!
  $exportConfiguration: InputExportConfiguration
) {
  consume {
    id
    setupConnectorStream(
      streamId: $streamId
      exportConfiguration: $exportConfiguration
    ) {
      ...Stream
      __typename
    }
    __typename
  }
}

fragment Stream on Stream {
  ...StreamBase
  mappingConfiguration
  __typename
}

fragment StreamBase on Stream {
  id
  name
  status
  createdBy
  modifiedBy
  type
  modifiedAt
  createdAt
  isOwner
  condition
  rules
  numberOfRecords
  rulesApplied
  containerName
  mode
  connectorProperties
  exportOutgoingEdges
  exportIncomingEdges
  exportOutgoingEdgeProperties
  exportIncomingEdgeProperties
  requiresAttention
  author {
    id
    username
    __typename
  }
  description
  connector {
    id
    name
    active
    accountDisplay
    accountId
    streamModes
    connector {
      id
      name
      icon
      streamModes
      __typename
    }
    connectorStatus {
      status
      connectorStatusDetails {
        providerDefinitionId
        hasError
        errorMessage
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
