query getStreams(
  $searchName: String
  $status: String
  $itemsPerPage: Int
  $pageNumber: Int
  $sortBy: String
  $sortDirection: String
  $exportTargetId: ID
  $includeStreamData: Boolean!
) {
  consume {
    id
    streams(
      searchName: $searchName
      status: $status
      itemsPerPage: $itemsPerPage
      pageNumber: $pageNumber
      sortBy: $sortBy
      sortDirection: $sortDirection
      exportTargetId: $exportTargetId
    ) {
      total
      data @include(if: $includeStreamData) {
        ...StreamListItem
        __typename
      }
      __typename
    }
    __typename
  }
}

fragment StreamListItem on Stream {
  id
  name
  status
  createdAt
  mode
  requiresAttention
  author {
    id
    username
    __typename
  }
  connector {
    id
    name
    active
    accountDisplay
    accountId
    streamModes
    connector {
      id
      name
      icon
      streamModes
      __typename
    }
    connectorStatus {
      status
      connectorStatusDetails {
        providerDefinitionId
        hasError
        errorMessage
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}
