query getDataSetContent(
  $dataSetId: ID!
  $page: Int
  $pageSize: Int
  $terms: String
  $disableFilters: Boolean
  $searchAfter: [String]
  $mainSort: String
  $receiptId: String
  $searchName: String
  $connectorConfigurationId: ID
) {
  inbound {
    id
    dataSetContent(
      id: $dataSetId
      page: $page
      pageSize: $pageSize
      terms: $terms
      disableFilters: $disableFilters
      searchAfter: $searchAfter
      mainSort: $mainSort
      receiptId: $receiptId
      searchName: $searchName
      connectorConfigurationId: $connectorConfigurationId
    )
    __typename
  }
}
