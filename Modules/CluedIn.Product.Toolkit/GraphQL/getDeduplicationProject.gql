query deDupProject($id: ID!, $skipLastDeduplicationRun: Boolean!) {
  management {
    deDupProject(id: $id) {
      id
      name
      status
      createdBy
      description
      deduplicationScopeFilter
      deduplicationScopeFilterType
      requiresAttention
      createdDate
      shouldLimitQuerySize
      querySizeLimit
      groupCount
      isOwner
      canBeAutomated {
        projectCanBeAutomated
        projectCanBeAutomatedMessage
        __typename
      }
      lastDeduplicationRun @skip(if: $skipLastDeduplicationRun)
      author {
        id
        username
        __typename
      }
      __typename
    }
    __typename
  }
}
