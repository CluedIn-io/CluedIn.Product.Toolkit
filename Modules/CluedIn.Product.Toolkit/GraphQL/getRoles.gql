query getRoles($searchName: String, $itemsPerPage: Int, $pageNumber: Int) {
  administration {
    id
    roles(
      searchName: $searchName
      itemsPerPage: $itemsPerPage
      pageNumber: $pageNumber
    ) {
      total
      data {
        id
        name
        description
        userCount
        __typename
      }
      __typename
    }
    __typename
  }
}
