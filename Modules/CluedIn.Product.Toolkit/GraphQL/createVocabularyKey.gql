mutation createVocabulary($vocabularyKey: InputVocabularyKey) {
  management {
    id
    createVocabularyKey(vocabularyKey: $vocabularyKey) {
      ...VocabularyKey
      __typename
    }
    __typename
  }
}

fragment VocabularyKey on VocabularyKey {
  displayName
  vocabularyKeyId
  vocabularyId
  name
  isVisible
  isCluedInCore
  isDynamic
  isProvider
  isObsolete
  groupName
  key
  storage
  dataClassificationCode
  dataType
  description
  dataAnnotationsIsPrimaryKey
  dataAnnotationsIsEditable
  dataAnnotationsIsNullable
  dataAnnotationsIsRequired
  dataAnnotationsMinimumLength
  dataAnnotationsMaximumLength
  providerId
  compositeVocabularyId
  compositeVocabularyKeyId
  compositeVocabulary {
    name
    displayName
    dataType
    __typename
  }
  mapsToOtherKeyId
  glossaryTermId
  additionalProperties
  createdAt
  createdBy
  mappedKey
  isValueChangeInsignificant
  connector {
    id
    name
    about
    icon
    type
    __typename
  }
  vocabulary {
    vocabularyId
    vocabularyName
    grouping
    isUsed
    connector {
      id
      name
      about
      icon
      __typename
    }
    __typename
  }
  __typename
}