query allCleanProjects(
  $page: Int
  $pageSize: Int
  $searchName: String
  $excludeProjectStages: [String]
  $includeProjectStages: [String]
) {
  preparation {
    allCleanProjects(
      page: $page
      pageSize: $pageSize
      searchName: $searchName
      excludeProjectStages: $excludeProjectStages
      includeProjectStages: $includeProjectStages
    ) {
      total
      projects {
        name
        rowCount
        createdDate
        lastCommittedDate
        lastCommittedBy
        createdBy
        id
        status
        author {
          id
          username
          __typename
        }
        lastCommittedByUser {
          id
          username
          __typename
        }
        requiresAttention
        __typename
      }
      __typename
    }
    __typename
  }
}
